known_blockers:
- provider 尚未接通完整 episode 的消息转换、工具响应、usage 入账与持久化；fake client 通过不等于真实服务验收
- 上传 v4 的真实单卡 SFT 已复核，本次 v5 修改待 GPU 验证；P08 真实语言模型 DPO trainer 未实现，P09 仍为数学检查
- 14 题为污染 smoke；现有 84 题为小规模 pilot；已分析的 12 道 test 只作诊断，尚无独立测试收益
- 当前验证环境无 GPU / 无容器运行时；API 凭据未探测。训练耗时与费用须以真实模型/序列长度/吞吐和云端报价实测
- ControlledModelRuntime 的模型请求/工具调用计数预算已验证；wall_seconds 尚未形成跨模型与工具的端到端强制超时，USD 上限尚未接入
- RL 同环境/同可见历史/同剩余预算的完整状态指纹尚未接入，不能仅凭现有 task/checkpoint 字段宣称完全同状态
- pi CLI 未安装：pi 外驱迁移实验前需安装并记录真实支持能力
decisions:
- PROJECT_ROOT 定为 CodeAgent-R（计划包同级目录）
- 包名 agentlab（承接原 AgentLab 底座定位），pyproject + src 布局
- P00 不创建任何训练/运行空实现，CLI 仅开放已验证命令
- P01 验证库选用 pydantic v2（沿用已有依赖，extra=forbid + Literal 字面量即轻量强验证）
- PrivateTask 不继承 PublicTask（类型隔离而非字段裁剪继承），build_prompt 运行时 isinstance 门
- 直构校验失败抛 pydantic ValidationError；from_contract_dict 统一包装 ContractError（双层设计，测试按层断言）
- 事件去重键冻结为 (episode_id, attempt, seq)；event_id 仅透传来源原生 ID 不合成
- BudgetLedger.unknown_spent_dims 用 list（JSON 可序列化），unknown 贡献使 total_usd() 返回 None
- P02 采用进程级隔离（独立工作区+参数列表子进程+进程组 SIGKILL 清理）；容器后端显式 unsupported，待资源接入，绝不静默回退宿主
- BudgetGuard：op_id 幂等（reserve/settle 重放 no-op）+ 线程锁并发准入；unknown 结算不落 0
- 快照哈希口径统一：manifest_hash 排除 .pristine（工作区侧）与 snapshot.json（存储侧）
- P03：任务=自建可审计迷你仓库（来源类型1）；公开测试必须在有缺陷代码上失败（§5.4）——审计测试 test_original_bug_reproduces
  曾抓出 5 个任务公开测试过弱的构造缺陷，已修复
- grader 空补丁语义：零改动是合法候选进入功能层，不判 patch_apply_failed
- P03 开发中 grader 抓出参考补丁自身缺陷（mini_io 键值空格未剥离）——审计候选库方法论的有效性实证
