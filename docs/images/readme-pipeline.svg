  </defs>
  <rect width="920" height="188" rx="12" fill="url(#paper)"/>
  <path d="M92 64H828" stroke="#43566a" stroke-width="3" stroke-linecap="round"/>
  <g fill="none" stroke="#8bb8ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M177 55l9 9-9 9"/>
    <path d="M361 55l9 9-9 9"/>
    <path d="M545 55l9 9-9 9"/>
    <path d="M729 55l9 9-9 9"/>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="750" text-anchor="middle" fill="#0b1520">
