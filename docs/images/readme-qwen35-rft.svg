      <stop stop-color="#182439"/>
      <stop offset="1" stop-color="#102937"/>
    </linearGradient>
  </defs>
  <rect width="920" height="400" rx="12" fill="url(#paper)"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
