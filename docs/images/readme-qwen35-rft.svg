    <text x="892" y="60" font-size="26" fill="#c8d6df" text-anchor="end">dev · tasks passed</text>
    <g font-size="24" font-weight="650" fill="#f6f9fc" text-anchor="middle">
      <text x="266" y="100">Human-written · 66 tasks</text>
      <text x="654" y="100">Synthetic · 99 tasks</text>
    </g>
    <path d="M84 328H836" stroke="#506373" stroke-width="2"/>
    <g fill="#8bb8ff">
      <path d="M112 328V237.4Q112 229.4 120 229.4H188Q196 229.4 196 237.4V328Z"/>
      <path d="M500 328V203.4Q500 195.4 508 195.4H576Q584 195.4 584 203.4V328Z"/>
