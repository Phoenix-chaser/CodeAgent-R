<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="title description">
  <title id="title">RFT after expanding the task pool: tasks passed on dev</title>
  <desc id="description">Grouped bars for the RFT round on the expanded pool, counted on dev. Human-written tasks, 66 in all: Base 29, A-verified 30, C-control 31. Synthetic tasks, 99 in all: Base 39, A-verified 49, C-control 50. The dashed line in each group marks the Base level.</desc>
